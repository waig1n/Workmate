[project]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
name = "workmate-backend"
version = "0.1.0"
description = "Workmate Enterprise Control Plane (product-api)"
requires-python = ">=3.12"
dependencies = [
    "workmate-product==0.1.0",
    "workmate-contracts==0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "email-validator>=2.0",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "wecom-aibot-python-sdk==1.0.2",
    "lark-oapi==1.5.3",
    "dingtalk-stream==0.24.3",
    "websockets>=13,<16",
    "python-multipart>=0.0.20",
]

[project.scripts]
workmate-start-product-api = "scripts.start_product_api:main"
workmate-command-deliveries = "scripts.command_deliveries:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.uv.sources]
workmate-product = { path = "../packages/product", editable = true }
workmate-contracts = { path = "../packages/contracts", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured external service",
]

[tool.coverage.run]
# SQLAlchemy async runs sync DB calls on greenlets; without this,
# coverage drops every line after such an await.
concurrency = ["greenlet"]
