<text x="822" y="252" font-size="17" font-weight="400" fill="#647180" text-anchor="start">WeCom · Feishu · DingTalk</text>
<path d="M 968 274 V 296 H 400 V 330" fill="none" stroke="#778694" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="330" width="680" height="150" rx="18" fill="#ffffff" stroke="#bccfc7"/>
<text x="88" y="367" font-size="24" font-weight="700" fill="#242c36" text-anchor="start">Gateway / FastAPI</text>
<text x="88" y="402" font-size="18" font-weight="400" fill="#647180" text-anchor="start">身份认证 · RBAC + Scope · Task 准入</text>
<text x="88" y="435" font-size="17" font-weight="400" fill="#647180" text-anchor="start">事务写入 · Outbox 发布器 · 实时输出与成果访问</text>
