<rect width="1200" height="1120" rx="24" fill="#fafbf8"/><rect x="1" y="1" width="1198" height="1118" rx="23" fill="url(#dots)" stroke="#e1e6e2"/>
<g font-family="Inter, Noto Sans CJK SC, Segoe UI, Arial, sans-serif">
