<text x="852" y="420" font-size="20" font-weight="650" fill="#087f70" text-anchor="start">PostgreSQL</text>
<text x="852" y="449" font-size="14" font-weight="400" fill="#647180" text-anchor="start">业务事实 · 执行权 · 快照</text>
<text x="852" y="473" font-size="13" font-weight="400" fill="#647180" text-anchor="start">owner / epoch / lease</text>
<rect x="838" y="510" width="280" height="108" rx="12" fill="#ffffff" stroke="#dce3df"/>
<text x="852" y="540" font-size="20" font-weight="650" fill="#087f70" text-anchor="start">Redis Streams</text>
<text x="852" y="569" font-size="14" font-weight="400" fill="#647180" text-anchor="start">命令与实时正文传输</text>
<text x="852" y="593" font-size="13" font-weight="400" fill="#647180" text-anchor="start">不授予执行权</text>
<rect x="838" y="630" width="280" height="108" rx="12" fill="#ffffff" stroke="#dce3df"/>
<text x="852" y="660" font-size="20" font-weight="650" fill="#087f70" text-anchor="start">S3 兼容对象存储</text>
<text x="852" y="689" font-size="14" font-weight="400" fill="#647180" text-anchor="start">Skill 包 · 知识库源文件</text>
<text x="852" y="713" font-size="13" font-weight="400" fill="#647180" text-anchor="start">可配置附件 / 成果 / 检查点</text>
<rect x="838" y="750" width="280" height="108" rx="12" fill="#ffffff" stroke="#dce3df"/>
<text x="852" y="780" font-size="20" font-weight="650" fill="#087f70" text-anchor="start">持久化文件卷</text>
<text x="852" y="809" font-size="14" font-weight="400" fill="#647180" text-anchor="start">Workspace · ReMe 本地数据</text>
<text x="852" y="833" font-size="13" font-weight="400" fill="#647180" text-anchor="start">默认本地附件与成果</text>
<rect x="838" y="870" width="280" height="108" rx="12" fill="#ffffff" stroke="#dce3df"/>
<text x="852" y="900" font-size="20" font-weight="650" fill="#087f70" text-anchor="start">Qdrant（可选）</text>
<text x="852" y="929" font-size="14" font-weight="400" fill="#647180" text-anchor="start">知识库向量索引</text>
<text x="852" y="953" font-size="13" font-weight="400" fill="#647180" text-anchor="start">由知识检索能力使用</text>
<path d="M 744 405 H 782 V 630 H 744" fill="none" stroke="#778694" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
