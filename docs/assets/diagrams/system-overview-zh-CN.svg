<text x="1152" y="58" font-size="14" font-weight="500" fill="#647180" text-anchor="end">01 / 系统总览</text>
<text x="64" y="115" font-size="32" font-weight="700" fill="#242c36" text-anchor="start">企业 AI 工作平台：职责与依赖</text>
<text x="64" y="148" font-size="18" font-weight="400" fill="#647180" text-anchor="start">统一入口 · 企业治理 · 原生执行 · 共享基础设施</text>
