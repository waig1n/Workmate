<text x="88" y="622" font-size="20" font-weight="400" fill="#647180" text-anchor="start">AgentScope Core 2.0.7 · Sandbox / Tools</text>
<text x="88" y="655" font-size="20" font-weight="400" fill="#647180" text-anchor="start">Workspace · ReMe · 多 Worker 副本</text>
<text x="88" y="686" font-size="16" font-weight="400" fill="#647180" text-anchor="start">通过 Redis 接收命令；从 PG 领取和校验执行权</text>
<text x="88" y="515" font-size="16" font-weight="400" fill="#4268be" text-anchor="start">命令与实时正文经 Redis 传输；Worker 直接驱动 Core</text>
<rect x="820" y="330" width="316" height="676" rx="18" fill="#edf2ef" stroke="#bccfc7"/>
<text x="844" y="367" font-size="23" font-weight="700" fill="#242c36" text-anchor="start">共享基础设施</text>
