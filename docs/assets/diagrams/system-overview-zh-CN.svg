<text x="454" y="252" font-size="17" font-weight="400" fill="#647180" text-anchor="start">一次性 · 每天 · 每周</text>
<path d="M 600 274 V 296 H 400 V 330" fill="none" stroke="#778694" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
