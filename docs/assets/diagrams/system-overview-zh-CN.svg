<rect x="64" y="758" width="680" height="248" rx="18" fill="#f3f5fa" stroke="#dce3df"/>
<text x="88" y="793" font-size="23" font-weight="700" fill="#242c36" text-anchor="start">能力与集成</text>
<rect x="88" y="814" width="304" height="76" rx="10" fill="#ffffff"/>
<text x="103" y="842" font-size="19" font-weight="650" fill="#087f70" text-anchor="start">模型接入</text>
<text x="103" y="869" font-size="14" font-weight="400" fill="#647180" text-anchor="start">可配置模型与端点</text>
<rect x="416" y="814" width="304" height="76" rx="10" fill="#ffffff"/>
<text x="431" y="842" font-size="19" font-weight="650" fill="#087f70" text-anchor="start">Skill / MCP</text>
<text x="431" y="869" font-size="14" font-weight="400" fill="#647180" text-anchor="start">受管能力 · 显式授权</text>
<rect x="88" y="902" width="304" height="76" rx="10" fill="#ffffff"/>
<text x="103" y="930" font-size="19" font-weight="650" fill="#087f70" text-anchor="start">知识检索</text>
<text x="103" y="957" font-size="14" font-weight="400" fill="#647180" text-anchor="start">授权过滤 · 检索与引用</text>
<rect x="416" y="902" width="304" height="76" rx="10" fill="#ffffff"/>
<text x="431" y="930" font-size="19" font-weight="650" fill="#087f70" text-anchor="start">Web 工具</text>
<text x="431" y="957" font-size="14" font-weight="400" fill="#647180" text-anchor="start">可选搜索与页面抓取</text>
<text x="64" y="1045" font-size="17" font-weight="400" fill="#647180" text-anchor="start">虚线：共享基础设施依赖。各服务仅访问其职责所需的存储与传输服务。</text>
<text x="64" y="1077" font-size="16" font-weight="400" fill="#647180" text-anchor="start">实线：接入或能力调用。浏览器只访问产品 API；此图不表示任务时序。</text>
