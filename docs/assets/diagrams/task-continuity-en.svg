<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Approval resume and failure recovery</title><desc id="desc">Approval resume retains Task and Reply identity; explicit failure recovery creates a new Task, Session and Workspace and requires verified evidence.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e6e7e2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#778694" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="850" rx="24" fill="#fafbf8"/><rect x="1" y="1" width="1198" height="848" rx="23" fill="url(#dots)" stroke="#e1e6e2"/>
<g font-family="Inter, Noto Sans CJK SC, Segoe UI, Arial, sans-serif">
<rect x="48" y="36" width="32" height="32" rx="8" fill="#191815"/>
<path d="m55 45 4 14h4l2-8 2 8h4l4-14h-4l-2 9-2-9h-4l-2 9-2-9z" fill="#fffefa"/>
<text x="92" y="59" font-size="18" font-weight="700" fill="#242c36" text-anchor="start">WORKMATE</text>
<text x="1152" y="58" font-size="14" font-weight="500" fill="#647180" text-anchor="end">03 / TASK CONTINUITY</text>
<text x="64" y="115" font-size="32" font-weight="700" fill="#242c36" text-anchor="start">Approval resume and failure recovery</text>
<text x="64" y="148" font-size="18" font-weight="400" fill="#647180" text-anchor="start">One conversation, distinct recovery paths. Validate state, execution authority, and file evidence.</text>
<rect x="64" y="184" width="1072" height="249" rx="20" fill="#f0f8f4" stroke="#c7ded3"/>
<text x="88" y="222" font-size="23" font-weight="700" fill="#087f70" text-anchor="start">01  Approval resume</text>
<rect x="88" y="248" width="304" height="94" rx="16" fill="#ffffff" stroke="#dce3df"/>
<rect x="108" y="270" width="5" height="22" rx="2" fill="#087f70"/>
<text x="126" y="288" font-size="22" font-weight="650" fill="#242c36" text-anchor="start">Running task</text>
<text x="110" y="318" font-size="17" font-weight="400" fill="#647180" text-anchor="start">Task A / Reply A</text>
<rect x="448" y="248" width="304" height="94" rx="16" fill="#ffffff" stroke="#dce3df"/>
<rect x="468" y="270" width="5" height="22" rx="2" fill="#087f70"/>
<text x="486" y="288" font-size="22" font-weight="650" fill="#242c36" text-anchor="start">Await a decision</text>
<text x="470" y="318" font-size="17" font-weight="400" fill="#647180" text-anchor="start">Save state · persist decision</text>
<rect x="808" y="248" width="304" height="94" rx="16" fill="#ffffff" stroke="#dce3df"/>
<rect x="828" y="270" width="5" height="22" rx="2" fill="#087f70"/>
<text x="846" y="288" font-size="22" font-weight="650" fill="#242c36" text-anchor="start">Resume the task</text>
<text x="830" y="318" font-size="17" font-weight="400" fill="#647180" text-anchor="start">Task A / Reply A</text>
<path d="M 392 295 H 448" fill="none" stroke="#778694" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 752 295 H 808" fill="none" stroke="#778694" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="88" y="380" font-size="19" font-weight="500" fill="#087f70" text-anchor="start">Retain Task / Reply identity and recheck current authorization.</text>
<text x="88" y="408" font-size="17" font-weight="400" fill="#647180" text-anchor="start">Cold resume also requires original storage identity and safe-suspension evidence.</text>
<rect x="64" y="466" width="1072" height="259" rx="20" fill="#fff7e9" stroke="#e4d5b7"/>
<text x="88" y="504" font-size="23" font-weight="700" fill="#a96b19" text-anchor="start">02  Explicit failure recovery</text>
<rect x="88" y="531" width="304" height="118" rx="16" fill="#ffffff" stroke="#dce3df"/>
<rect x="108" y="553" width="5" height="22" rx="2" fill="#a96b19"/>
<text x="126" y="571" font-size="21" font-weight="650" fill="#242c36" text-anchor="start">Failed execution</text>
<text x="110" y="601" font-size="17" font-weight="400" fill="#647180" text-anchor="start">Task A / Session A</text>
<rect x="448" y="531" width="304" height="118" rx="16" fill="#ffffff" stroke="#dce3df"/>
<rect x="468" y="553" width="5" height="22" rx="2" fill="#a96b19"/>
<text x="486" y="571" font-size="21" font-weight="650" fill="#242c36" text-anchor="start">Verify and isolate</text>
<text x="470" y="601" font-size="17" font-weight="400" fill="#647180" text-anchor="start">Ownership · cleanup</text>
<text x="470" y="626" font-size="17" font-weight="400" fill="#647180" text-anchor="start">File checkpoint, when enabled</text>
<rect x="808" y="531" width="304" height="118" rx="16" fill="#ffffff" stroke="#dce3df"/>
<rect x="828" y="553" width="5" height="22" rx="2" fill="#a96b19"/>
<text x="846" y="571" font-size="21" font-weight="650" fill="#242c36" text-anchor="start">Create a new execution</text>
<text x="830" y="601" font-size="17" font-weight="400" fill="#647180" text-anchor="start">Task B / Session B</text>
<text x="830" y="626" font-size="17" font-weight="400" fill="#647180" text-anchor="start">New Workspace</text>
<path d="M 392 582 H 448" fill="none" stroke="#778694" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 752 582 H 808" fill="none" stroke="#778694" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="88" y="688" font-size="17" font-weight="500" fill="#a96b19" text-anchor="start">Recover within the same Conversation; do not replay unknown external side effects automatically.</text>
<text x="64" y="771" font-size="20" font-weight="650" fill="#242c36" text-anchor="start">Message snapshots ≠ Core state snapshots ≠ Workspace file checkpoints</text>
<text x="64" y="805" font-size="17" font-weight="400" fill="#647180" text-anchor="start">File checkpoints are opt-in and backend-dependent. Lease expiry alone never authorizes takeover.</text>
</g></svg>
