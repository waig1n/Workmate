[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
name = "workmate-product"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["workmate-contracts==0.1.0", "sqlalchemy[asyncio]>=2.0", "pydantic>=2.11", "pyyaml>=6.0", "httpx>=0.27", "jsonschema>=4.25", "referencing>=0.36", "boto3>=1.37,<2", "redis>=5.0"]

[tool.uv.sources]
workmate-contracts = { path = "../contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/workmate_product"]
